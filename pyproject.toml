[project]
name = "mindpalace"
version = "0.2.0"
description = "Local-first MCP server: a deterministic memory engine for physical objects, controlled by any LLM that speaks MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2",
    "pydantic>=2.12",
    "python-dotenv>=1.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "rapidfuzz>=3.10",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0.0",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mindpalace = "mindpalace.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mindpalace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
